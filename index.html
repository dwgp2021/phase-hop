<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7efd9"><title>咕噜合合 · GULU</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation}body{font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,sans-serif;background:#f7efd9;color:#433e38}.game{width:min(100%,435px);height:100dvh;margin:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 13px) 17px calc(env(safe-area-inset-bottom) + 12px)}.header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:950;letter-spacing:-1px}.logo i{color:#e57b5b;font-style:normal}.sub{font-size:10px;letter-spacing:2px;font-weight:800;color:#9a9185}.scores{display:flex;gap:7px}.stat{min-width:74px;text-align:center;border:2px solid #51483e;border-radius:13px;background:#fffaf0;box-shadow:2px 3px 0 #51483e;padding:3px 7px}.stat small{font-size:9px;letter-spacing:1px;color:#8b8276;display:block}.stat b{font-size:20px}.helper{text-align:center;font-size:12px;color:#776f62;margin:auto 0 8px;font-weight:650}.board{width:100%;aspect-ratio:5/7;max-height:58dvh;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(7,1fr);gap:5px;padding:9px;background:#e9ddc3;border:3px solid #51483e;border-radius:19px;box-shadow:5px 6px 0 #51483e;touch-action:manipulation}.cell{border-radius:10px;background:#dcd0b7;box-shadow:inset 0 2px #c6b99f;display:grid;place-items:center;min-width:0;overflow:visible}.ball{height:93%;aspect-ratio:1;max-width:98%;border-radius:50%;border:2.5px solid #51483e;display:grid;place-items:center;font-weight:950;font-size:clamp(17px,5.9vw,28px);position:relative;box-shadow:2px 3px 0 #51483e;animation:pop .2s cubic-bezier(.17,1.5,.55,1);color:#443d39}.ball:before{content:"";position:absolute;left:19%;top:12%;width:25%;height:10%;background:#fff9;border-radius:50%;transform:rotate(-28deg)}.n1{background:#99d8ba}.n2{background:#a3c8f4}.n4{background:#d1b4e8}.n8{background:#f2a8a0}.n16{background:#f4c377}.n32{background:#ebdd81}.n64{background:#a6c99a}.n128{background:#efb8d4}.n256{background:#d9b0a1}.bottom{display:flex;align-items:center;gap:9px;margin-top:15px}.next{flex:1;display:flex;align-items:center;gap:10px;background:#fffaf0;border:2px solid #51483e;border-radius:14px;padding:7px 10px;box-shadow:2px 3px 0 #51483e}.next .ball{width:43px;height:43px;font-size:19px;flex-shrink:0}.next small{font-size:10px;display:block;color:#938779}.next b{font-size:14px}button{font-family:inherit;cursor:pointer;font-weight:800}.tool{height:62px;min-width:64px;background:#fffaf0;border:2px solid #51483e;border-radius:14px;box-shadow:2px 3px 0 #51483e;color:#51483e}.tool:active,.primary:active{transform:translate(2px,3px);box-shadow:none}.tool:disabled{opacity:.35}.message{text-align:center;margin-top:12px;min-height:20px;font-weight:850;color:#c36e50;font-size:14px}.footer{text-align:center;color:#a09688;font-size:10px;margin-top:4px}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#f7efd9f2;padding:24px;z-index:3}.overlay.hidden{display:none}.panel{width:min(100%,340px);text-align:center}.face{width:112px;height:112px;border:4px solid #51483e;border-radius:50%;margin:0 auto 23px;background:#99d8ba;position:relative;box-shadow:6px 7px 0 #51483e;transform:rotate(-8deg)}.face:before,.face:after{content:"";position:absolute;top:42px;width:9px;height:13px;border-radius:50%;background:#51483e}.face:before{left:31px}.face:after{right:31px}.smile{position:absolute;left:44px;top:63px;width:20px;height:12px;border:3px solid #51483e;border-top:0;border-radius:0 0 17px 17px}.heading{font-size:43px;font-weight:950;letter-spacing:-2px;margin:4px 0 6px}.desc{font-size:13px;color:#81766a;line-height:1.7}.rules{text-align:left;margin:27px 0;padding:18px 19px;background:#fffaf0;border:2px solid #51483e;border-radius:16px;box-shadow:3px 4px 0 #51483e;font-size:14px;line-height:2.2}.rules strong{color:#cf7959}.primary{border:2px solid #51483e;background:#ed996e;color:#433a32;border-radius:15px;width:100%;height:58px;font-size:18px;box-shadow:3px 4px 0 #51483e}.endnum{font-size:68px;font-weight:950;margin:18px 0}.endnote{font-size:13px;color:#85796c;margin-bottom:20px}@keyframes pop{from{transform:scale(.2);opacity:.5}to{transform:scale(1);opacity:1}}@media(max-height:720px){.board{max-height:54dvh}.game{padding-top:8px}.helper{margin:8px 0}.bottom{margin-top:9px}.message{margin-top:7px}.footer{display:none}}
</style></head><body>
<main class="game"><div class="header"><div><div class="logo">咕噜<i>合合</i></div><div class="sub">GULU · LITTLE PUZZLE</div></div><div class="scores"><div class="stat"><small>得分</small><b id="score">0</b></div><div class="stat"><small>最高</small><b id="best">0</b></div></div></div><div class="helper">点一列，放一个球。三个相连就合成！</div><div id="board" class="board"></div><div class="message" id="message"></div><div class="bottom"><div class="next"><div id="preview" class="ball n1">1</div><div><small>下一个</small><b id="previewLabel">小绿豆</b></div></div><button id="undo" class="tool">↶<div style="font-size:11px">撤销</div></button><button id="restart" class="tool">↻<div style="font-size:11px">重来</div></button></div><div class="footer">不计时 · 慢慢玩 · 每一步都算数</div></main>
<div id="intro" class="overlay"><div class="panel"><div class="face"><div class="smile"></div></div><div class="heading">咕噜合合</div><div class="desc">一个轻轻点，越合越开心的小游戏</div><div class="rules"><strong>①</strong> 点任意一列，让小球落下<br><strong>②</strong> 三个相同数字连起来就会合成<br><strong>③</strong> 连锁合成，拿到更高分<br>✿ 没有倒计时，想多久都可以</div><button class="primary" id="play">开始玩吧 →</button></div></div>
<div id="over" class="overlay hidden"><div class="panel"><div class="face" style="background:#f4c377;transform:rotate(9deg)"><div class="smile"></div></div><div class="heading">装满啦！</div><div class="desc">这一局拿到了</div><div class="endnum" id="final">0</div><div class="endnote" id="record"></div><button class="primary" id="again">再玩一局 →</button></div></div>
<script>
(()=>{'use strict';const W=5,H=7,$=id=>document.getElementById(id),board=$('board');let g=[],next=1,score=0,best=0,history=null,active=false,busy=false,run=0,audio;try{best=Number(localStorage.getItem('gulu-best'))||0}catch(e){}$('best').textContent=best;const pick=()=>{let p=Math.random();return p<.62?1:p<.92?2:4},tier=v=>'n'+Math.min(256,v),names={1:'小绿豆',2:'蓝莓糖',4:'葡萄糖',8:'草莓糖',16:'橘子糖',32:'柠檬糖',64:'青苹果糖'};const wait=ms=>new Promise(r=>setTimeout(r,ms));function sound(f){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),a=audio.createGain();o.type='sine';o.frequency.value=f;a.gain.setValueAtTime(.035,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch(e){}}function paint(){let html='';for(let r=0;r<H;r++)for(let c=0;c<W;c++){const n=g[r][c];html+='<div class="cell" data-c="'+c+'">'+(n?'<div class="ball '+tier(n)+'">'+n+'</div>':'')+'</div>'}board.innerHTML=html;$('score').textContent=score;$('best').textContent=best;$('preview').className='ball '+tier(next);$('preview').textContent=next;$('previewLabel').textContent=names[next]||'彩色糖球';$('undo').disabled=!history||busy}function message(s){$('message').textContent=s}function start(){run++;g=Array.from({length:H},()=>Array(W).fill(0));next=1;score=0;history=null;active=true;busy=false;message('');$('intro').classList.add('hidden');$('over').classList.add('hidden');paint()}function slot(c){for(let r=H-1;r>=0;r--)if(!g[r][c])return r;return-1}function cluster(r,c,v,seen=new Set()){if(r<0||c<0||r>=H||c>=W||g[r][c]!==v)return seen;let k=r*W+c;if(seen.has(k))return seen;seen.add(k);cluster(r-1,c,v,seen);cluster(r+1,c,v,seen);cluster(r,c-1,v,seen);cluster(r,c+1,v,seen);return seen}function settle(){for(let c=0;c<W;c++){let values=[];for(let r=H-1;r>=0;r--)if(g[r][c])values.push(g[r][c]);for(let r=H-1;r>=0;r--)g[r][c]=values[H-1-r]||0}}async function move(c){if(!active||busy||!Number.isInteger(c)||c<0||c>=W)return;let r=slot(c);if(r<0){message('这列装满啦，换一列试试');return}history={g:g.map(a=>a.slice()),next,score};g[r][c]=next;next=pick();busy=true;paint();sound(360);await wait(160);let combo=0,token=run;while(token===run){let bestGroup=null;for(let y=H-1;y>=0;y--)for(let x=0;x<W;x++)if(g[y][x]){let a=cluster(y,x,g[y][x]);if(a.size>=3&&(!bestGroup||a.size>bestGroup.a.size))bestGroup={a,v:g[y][x]}}if(!bestGroup)break;combo++;const indices=[...bestGroup.a],anchor=indices.reduce((a,b)=>Math.floor(a/W)>Math.floor(b/W)?a:b),ar=Math.floor(anchor/W),ac=anchor%W;for(let k of indices)g[Math.floor(k/W)][k%W]=0;g[ar][ac]=bestGroup.v*2;score+=bestGroup.v*indices.length*combo*10;message(combo>1?'连锁 ×'+combo+'！':'合成成功！');sound(430+combo*90);if(score>best){best=score;try{localStorage.setItem('gulu-best',best)}catch(e){}}paint();await wait(300);if(token!==run)return;settle();paint();await wait(200)}if(token!==run)return;busy=false;paint();if(g[0].every(v=>v!==0)){active=false;$('final').textContent=score;$('record').textContent='最高得分 '+best;await wait(380);if(token===run)$('over').classList.remove('hidden')}else if(combo===0)message(['再来一个！','下一步会发生什么？','慢慢来，别着急'][Math.floor(Math.random()*3)])}
board.addEventListener('pointerdown',e=>{let cell=e.target.closest('.cell');if(cell)move(Number(cell.dataset.c))});$('play').onclick=start;$('again').onclick=start;$('restart').onclick=()=>{if(confirm('重新开一局？'))start()};$('undo').onclick=()=>{if(!history||busy||!active)return;g=history.g.map(a=>a.slice());next=history.next;score=history.score;history=null;message('撤销成功');paint()};paint()
})();
</script></body></html>
