<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f6e9c9"><title>坏蛋小区 · 会动的恶作剧</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#44382c}body{background:#f5e8c8}main{margin:auto;max-width:450px;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.brand{font-size:26px;font-weight:1000;letter-spacing:-1px}.brand em{color:#d87555;font-style:normal}.sub{font-size:10px;color:#907d66}.counter{padding:8px 12px;background:#fff7e9;border:2px solid #5a4939;border-radius:13px;box-shadow:2px 3px #5a4939;font-weight:900}#scene{display:block;width:100%;flex:1;min-height:0;background:#bfe0d5;border:3px solid #584634;border-radius:19px;box-shadow:4px 5px #584634;touch-action:none}.tip{margin:11px 0 8px;text-align:center;font-size:12px;min-height:31px;color:#765e4e;font-weight:800}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tool{border:2px solid #594734;border-radius:13px;background:#fff9ec;box-shadow:2px 3px #594734;padding:8px 3px;font:850 13px system-ui;color:#55422e;min-height:61px}.tool span{display:block;font-size:24px}.tool.selected{background:#ffca81;transform:translate(1px,2px);box-shadow:1px 1px #594734}.actions{display:flex;gap:9px;margin-top:10px}.act{border:2px solid #594734;border-radius:13px;padding:12px 5px;box-shadow:2px 3px #594734;font-weight:900;background:#f2a477;color:#4a352c;font-size:15px;flex:1}.act.secondary{background:#fff8ea;flex:.7}.act:disabled{opacity:.5}.status{font-size:10px;color:#918170;text-align:center;margin-top:8px}.sheet{position:fixed;inset:0;background:#f6e9c9ed;display:grid;place-items:center;padding:25px;z-index:4}.sheet.hidden{display:none}.panel{max-width:350px;text-align:center}.mascot{font-size:85px;filter:drop-shadow(3px 5px #584634);animation:wiggle 1.5s infinite alternate}@keyframes wiggle{from{transform:rotate(-8deg)}to{transform:rotate(7deg)}}h1{font-size:42px;margin:10px 0}.paragraph{line-height:2.1;font-size:14px;text-align:left;background:#fffaf0;padding:18px;border:2px solid #584634;border-radius:17px;box-shadow:3px 4px #584634}.primary{background:#f5ac76;border:2px solid #584634;box-shadow:3px 4px #584634;border-radius:15px;width:100%;padding:16px;font-size:18px;font-weight:900;margin-top:22px;color:#44352b}button:active{transform:translate(2px,2px);box-shadow:none!important}
</style></head><body><main><header><div><div class="brand">坏蛋<em>小区</em> 🏡</div><div class="sub">BAD NEIGHBORHOOD · 邻居的倒霉一天</div></div><div class="counter">🪙 <span id="coins">100</span></div></header><canvas id="scene"></canvas><div class="tip" id="tip">选个机关，点院子布置，看邻居会发生什么</div><div class="tools"><button class="tool selected" data-trap="banana"><span>🍌</span>香蕉皮 · 15</button><button class="tool" data-trap="spring"><span>🌀</span>弹簧垫 · 25</button><button class="tool" data-trap="paint"><span>🎨</span>油漆桶 · 35</button></div><div class="actions"><button class="act" id="visit">🚶 邻居出门啦！</button><button class="act secondary" id="home">🏠 我的家</button></div><div class="status">点院子摆机关 · 看现场动画 · 赚金币解锁更离谱的连锁</div></main><div class="sheet" id="intro"><div class="panel"><div class="mascot">😈</div><h1>坏蛋小区</h1><div class="paragraph">这里的邻居都不太正经。<br>① 选一个恶作剧道具。<br>② 直接点院子，把机关藏好。<br>③ 邻居会真的走过来踩到它！<br><b>别只看文字，机关会现场表演。</b></div><button class="primary" id="start">偷偷开张 →</button></div></div><script>
(()=>{'use strict';const c=document.getElementById('scene'),g=c.getContext('2d'),$=id=>document.getElementById(id),W=360,H=570,TAU=Math.PI*2,prices={banana:15,spring:25,paint:35};let coins=100,trap='banana',traps=[],npc={x:400,y:408,mode:'idle',vy:0,angle:0,paint:0},hero={x:54,y:445},particles=[],texts=[],tick=0,last=0,active=false,phase='setup',chain=0,visits=0,home=false,night=false;try{const v=JSON.parse(localStorage.getItem('bad-hood-animated')||'null');if(v){coins=v.coins??100;visits=v.visits??0}}catch(e){}function save(){try{localStorage.setItem('bad-hood-animated',JSON.stringify({coins,visits}))}catch(e){}}function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}resize();function round(x,y,w,h,r,col,border='#584633',width=3){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=col;g.fill();if(border){g.lineWidth=width;g.strokeStyle=border;g.stroke()}}function ellipse(x,y,rx,ry,color,stroke=null,sw=2){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=color;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=sw;g.stroke()}}function line(x,y,a,b,col='#584633',width=3){g.strokeStyle=col;g.lineWidth=width;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke()}function float(text,x,y,color='#fff8e6'){texts.push({text,x,y,life:110,color})}function confetti(x,y,col,n=20){for(let i=0;i<n;i++){let a=Math.random()*TAU,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:65,col})}}function drawHouse(x,y,col,label){g.fillStyle='#df8675';g.beginPath();g.moveTo(x-15,y+36);g.lineTo(x+72,y-24);g.lineTo(x+160,y+36);g.closePath();g.fill();g.strokeStyle='#584633';g.lineWidth=4;g.stroke();round(x,y+34,145,142,7,col);round(x+51,y+103,42,73,4,'#ae725c');round(x+12,y+60,33,32,5,'#e2eff0');round(x+105,y+60,28,32,5,'#e2eff0');line(x+28,y+61,x+28,y+91);line(x+118,y+61,x+118,y+91);ellipse(x+85,y+142,3,4,'#ffcb80');round(x+26,y-2,90,27,9,'#fffbf0');g.textAlign='center';g.font='900 13px system-ui';g.fillStyle='#584633';g.fillText(label,x+71,y+17)}function character(x,y,kind,action=0){g.save();g.translate(x,y);let jump=action===1?-Math.abs(Math.sin(tick*.14))*42:0;g.translate(0,jump);g.rotate(action===2?Math.sin(tick*.4)*.55:0);ellipse(0,15,28,8,'#6a735240');ellipse(0,-8,23,25,kind==='npc'?'#f4bf9c':'#c6aadf','#584633',3);ellipse(-8,-13,3,5,'#45352e');ellipse(9,-13,3,5,'#45352e');g.strokeStyle='#584633';g.lineWidth=2.5;g.beginPath();g.arc(0,-5,7,.1,Math.PI-.1);g.stroke();ellipse(-15,-3,5,4,'#f2a1a1');ellipse(16,-3,5,4,'#f2a1a1');line(-12,14,-14,25);line(12,14,14,25);if(kind==='npc'&&npc.paint){ellipse(4,-26,13,9,'#709bd0');ellipse(-16,-17,7,10,'#709bd0')}g.restore()}function backdrop(){g.fillStyle=night?'#57647d':'#bfe2d5';g.fillRect(0,0,W,H);ellipse(290,68,34,34,night?'#ffedbf':'#fff0b0');for(let i=0;i<4;i++){let x=((i*122+tick*.08)%485)-55;ellipse(x,70+i%2*38,35,11,'#fff7e9b0');ellipse(x+21,64+i%2*38,28,14,'#fff7e9b0')}g.fillStyle='#aad19d';g.fillRect(0,300,360,270);g.fillStyle='#87b78b';g.fillRect(0,480,360,90);round(0,430,360,77,0,'#e9d8b7',null);for(let x=0;x<360;x+=45)line(x,471,x+27,471,'#d4be9c',2);for(let i=0;i<8;i++){let x=i*47+12;ellipse(x,397+(i%2)*11,17,16,'#91b886');ellipse(x-7,398,8,8,'#a7ca92')}drawHouse(108,179,home?'#f3c99d':'#f1d29c',home?'我的小屋':'隔壁阿强');round(8,317,87,28,8,'#fff9e7');g.font='bold 12px system-ui';g.fillStyle='#695544';g.textAlign='center';g.fillText(home?'🏠 安全区':'😈 恶作剧区',52,335)}function drawTrap(t){let bounce=Math.sin(tick*.13)*2;g.save();g.translate(t.x,t.y+bounce);if(t.type==='banana'){g.font='29px system-ui';g.textAlign='center';g.fillText('🍌',0,1)}else if(t.type==='spring'){ellipse(0,-2,24,8,'#e8a8a2','#584633');for(let i=0;i<4;i++)line(-16+i*10,-5,-10+i*10,-16,'#6b8c9c',4);ellipse(0,-20,20,7,'#f5d180','#584633')}else{g.font='28px system-ui';g.textAlign='center';g.fillText('🎨',0,2)}g.restore()}function draw(){backdrop();for(let t of traps)drawTrap(t);character(hero.x,hero.y,'hero',phase==='success'?1:0);if(npc.mode!=='idle')character(npc.x,npc.y,'npc',npc.mode==='bounce'?1:npc.mode==='slip'?2:0);for(let p of particles){g.globalAlpha=Math.max(0,p.life/65);ellipse(p.x,p.y,3,3,p.col);g.globalAlpha=1}g.textAlign='center';g.font='900 16px system-ui';for(let t of texts){g.globalAlpha=Math.min(1,t.life/22);round(t.x-60,t.y-28,120,36,14,t.color);g.fillStyle='#5b4134';g.fillText(t.text,t.x,t.y-5);g.globalAlpha=1}if(phase==='setup'&&!home){round(33,505,294,39,13,'#fff5e5');g.fillStyle='#66513f';g.font='bold 13px system-ui';g.textAlign='center';g.fillText('点草地放机关 · 再让阿强出门',180,530)}}
function update(dt){tick+=dt;if(phase==='walk'){npc.x-=1.25*dt;if(npc.x<324&&npc.x>20){for(let t of traps){if(!t.used&&Math.abs(npc.x-t.x)<15){t.used=true;chain++;npc.mode=t.type==='spring'?'bounce':t.type==='banana'?'slip':'paint';npc.paint=t.type==='paint'?1:npc.paint;confetti(npc.x,npc.y-17,t.type==='paint'?'#6fa1df':'#ffdd78');float(t.type==='banana'?'哎呀滑倒！':t.type==='spring'?'飞起来啦！':'被涂成蓝色！',180,110);phase='reaction';last=0;break}}}if(npc.x<-36){phase='done';float('阿强溜走了',180,120);setTimeout(()=>{if(phase==='done')recover()},950)}}else if(phase==='reaction'){last+=dt;if(npc.mode==='slip'){npc.x-=2*dt;npc.angle+=.18*dt}else if(npc.mode==='bounce'){npc.x-=1.2*dt}else{npc.x-=.7*dt}if(last>88){let award=15+chain*12;coins+=award;$('coins').textContent=coins;save();confetti(npc.x,npc.y,'#ffd778',26);float('连锁奖励 +'+award+'🪙',180,155);phase='success';setTimeout(()=>{if(phase==='success'){npc.mode='walk';phase='walk'}},850)}}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.11*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(let t of texts){t.y-=.22*dt;t.life-=dt}texts=texts.filter(t=>t.life>0)}function loop(ms){let d=Math.min(2,(ms-(loop.last||ms))/16.7);loop.last=ms;update(d);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function recover(){phase='setup';npc={x:400,y:408,mode:'idle',vy:0,angle:0,paint:0};traps=[];chain=0;$('visit').disabled=false;$('visit').textContent='🚶 邻居出门啦！';$('tip').textContent='新的一轮！继续摆机关'}function choose(t){trap=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('selected',b.dataset.trap===trap));$('tip').textContent='已选择道具，点院子空地放下'}document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>choose(b.dataset.trap));c.addEventListener('pointerdown',e=>{if(phase!=='setup'||home)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*360,y=(e.clientY-r.top)/r.height*570;if(y<348||y>476){$('tip').textContent='机关要放在院子的草地和小路上';return}if(coins<prices[trap]){$('tip').textContent='金币不够啦！等邻居来送点金币';return}if(traps.length>=5){$('tip').textContent='最多布置 5 个机关，先看看效果';return}coins-=prices[trap];$('coins').textContent=coins;save();traps.push({x,y:410,type:trap,used:false});$('tip').textContent='机关已安放！再放一个，或让邻居出门';confetti(x,410,'#fff6bf',8)});
$('visit').onclick=()=>{if(phase!=='setup')return;home=false;phase='walk';npc={x:392,y:408,mode:'walk',paint:0};traps.sort((a,b)=>b.x-a.x);traps.forEach(t=>t.used=false);chain=0;visits++;save();$('tip').textContent='阿强正在散步……看现场！';$('visit').disabled=true;$('visit').textContent='🎬 正在发生…';if(traps.length===0)float('什么机关都没有？',180,95)};$('home').onclick=()=>{if(phase!=='setup')return;home=!home;$('home').textContent=home?'↩ 去隔壁':'🏠 我的家';$('tip').textContent=home?'这是你的家。现在邻居还没来恶作剧。':'回到邻居院子，继续布置机关'};$('start').onclick=()=>$('intro').classList.add('hidden');function clamp(x,a,b){return Math.max(a,Math.min(b,x))}})();
</script></body></html>
