<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HUD Vision · Chrome版</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#080b11;color:#eef4ff}header{padding:20px 18px 12px;max-width:1050px;margin:auto}h1{font-size:24px;letter-spacing:-.5px;margin:0}small,.muted{color:#9da8bc}main{max-width:1050px;padding:0 14px 40px;margin:auto}.panel{background:#121924;border:1px solid #273343;border-radius:18px;padding:16px;margin:12px 0}.tag{font-size:11px;color:#6dbaff;letter-spacing:2px;font-weight:700}h2{font-size:16px;margin:6px 0 14px}input[type=file]{display:block;width:100%;font-size:16px;padding:16px;background:#212d3a;border-radius:12px;border:1px solid #42536a;color:white}button{background:#287ee7;border:0;color:white;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:650;cursor:pointer}button.secondary{background:#263444}button:disabled{opacity:.4}button+button{margin-left:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button+button{margin:0}video{width:100%;max-height:45vh;background:black;border-radius:12px;margin-top:12px;display:block}#status{font-size:13px;color:#8ec4ff;line-height:1.6;overflow-wrap:anywhere;padding-top:8px}#log{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.7 ui-monospace,monospace;color:#93a0b2;max-height:130px;overflow:auto}.hud{aspect-ratio:16/9;background:#000;border:1px solid #253242;border-radius:13px;position:relative;overflow:hidden;container-type:inline-size}.strip{position:absolute;bottom:10%;left:5%;right:5%;display:flex;align-items:center;gap:3%;justify-content:space-between;color:#fff}.speed{font-size:clamp(32px,9cqw,95px);line-height:.85;letter-spacing:-.07em;font-weight:700}.sub{font-size:clamp(9px,1.6cqw,16px);color:#aebcd0;margin-top:6px}.navigation{flex:1;min-width:0;display:flex;gap:4%;align-items:center}.turn{font-size:clamp(27px,6cqw,66px);color:#52aaff}.navtext strong{font-size:clamp(16px,4cqw,41px);white-space:nowrap}.navtext .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.signals{display:flex;gap:clamp(8px,1.5cqw,20px)}.sig{display:flex;align-items:center;flex-direction:column;gap:4px}.sig .dir{font-size:clamp(10px,2.3cqw,24px)}.circle{border:clamp(2px,.65cqw,6px) solid #e14d55;color:white;background:#35151b;width:clamp(30px,6.5cqw,70px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(12px,3cqw,30px);font-weight:700}.circle.green{border-color:#38e58e;background:#092e20}.secondaryInfo{font-size:clamp(9px,1.5cqw,15px);color:#a4aec0}.sep{height:clamp(36px,8cqw,75px);width:1px;background:#445166}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;color:#a5b1c3;font-size:12px;margin-bottom:5px}.field input{width:100%;background:#202d3a;border:1px solid #415167;color:white;border-radius:9px;padding:11px;font-size:16px}canvas{display:none}.note{font-size:12px;line-height:1.7;color:#afbdd0}#ocrTxt{margin-top:8px;white-space:pre-wrap;font-family:monospace;font-size:12px;color:#a3b7cf} @media(max-width:640px){.secondaryInfo{display:none}.fields{grid-template-columns:repeat(2,1fr)}.hud{border-radius:8px}.panel{padding:12px}.strip{bottom:13%}}
</style></head><body><header><div class="tag">HUD VISION / CHROME</div><h1>仪表视频 → HUD</h1><small>网页版 · 本地选取视频 · 识别试验 · 实时预览</small></header><main>
<section class="panel"><h2>01 · 导入视频</h2><input id="file" type="file" accept="video/*,.mp4,.mov,.m4v"><div id="status" role="status">请选择手机相册或文件中的视频（无需上传到服务器）。</div><video id="video" controls playsinline preload="metadata" muted></video><div class="actions"><button id="play" type="button">播放 / 暂停</button><button id="shot" class="secondary" type="button">截取当前帧</button><button id="ocr" class="secondary" type="button">识别当前帧（实验）</button></div><div id="ocrTxt"></div></section>
<section class="panel"><h2>02 · HUD 下置信息带</h2><div class="hud" id="hud"><div class="strip"><div><div class="speed" id="vSpeed">--</div><div class="sub">km/h</div></div><div class="sep"></div><div class="navigation"><div class="turn">↱</div><div class="navtext"><strong id="vDistance">-- m</strong><div class="sub" id="vRoad">导航未连接</div></div></div><div class="signals"><div class="sig"><div class="dir">↰</div><div id="vLeft" class="circle">--</div></div><div class="sig"><div class="dir">↑</div><div id="vStraight" class="circle">--</div></div><div class="sig"><div class="dir">↱</div><div id="vRight" class="circle">--</div></div></div></div></div><div class="actions"><button id="full">HUD 全屏</button><button id="demo" class="secondary">查看演示数据</button><button id="clear" class="secondary">清除演示</button></div><p class="note">导航和红绿灯没有连接数据源时保持“--”，不会将演示数据伪装成真实路况。全屏适合 Chrome 横屏展示。</p></section>
<section class="panel"><h2>03 · 识别结果 / 手动纠错</h2><div class="fields"><div class="field"><label>车速 km/h</label><input id="speed" type="number" min="0" max="300" placeholder="尚未识别"></div><div class="field"><label>导航距离 m</label><input id="distance" type="number" min="0" placeholder="未接入"></div><div class="field"><label>道路名称</label><input id="road" placeholder="未接入导航"></div><div class="field"><label>续航 km（记录）</label><input id="range" type="number" placeholder="尚未识别"></div></div><p class="note">OCR 需要浏览器能加载开源识别引擎；目前仅作辅助提取数字，可能误把时间、转速、里程当车速，必须人工确认。暂不支持全视频自动连续识别。</p><div id="log"></div></section>
<canvas id="canvas"></canvas>
</main><script>
(()=>{const $=id=>document.getElementById(id), file=$('file'),v=$('video');let url=null, worker=null;function log(s){$('log').textContent=new Date().toLocaleTimeString()+'  '+s+'\n'+$('log').textContent;}function status(s){$('status').textContent=s;log(s)}
file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f){status('未选择视频');return}if(url)URL.revokeObjectURL(url);v.pause();v.removeAttribute('src');v.load();url=URL.createObjectURL(f);status('已选择 '+f.name+' · '+(f.size/1024/1024).toFixed(1)+' MB，尝试读取视频……');v.src=url;v.load();});
v.addEventListener('loadedmetadata',()=>status('视频已加载 · '+Math.round(v.duration||0)+' 秒，点击播放按钮'));
v.addEventListener('loadeddata',()=>status('视频画面已成功解码'));
v.addEventListener('error',()=>status('视频解码失败：'+({1:'加载中断',2:'网络/本地读取失败',3:'当前编码无法解码',4:'不支持当前视频格式'}[v.error?.code]||'未知错误')+'。建议在 Chrome 使用 H.264 MP4 文件'));
$('play').onclick=async()=>{if(!v.src){status('请先选择视频');return}try{if(v.paused){await v.play();status('正在播放')}else{v.pause();status('已暂停')}}catch(e){status('播放失败：'+e.message)}};
function frame(){if(!v.videoWidth)throw Error('尚未成功解码视频画面');const c=$('canvas');const scale=Math.min(1,1100/v.videoWidth);c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);c.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0,c.width,c.height);return c}
$('shot').onclick=()=>{try{const c=frame();const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='hud-frame.png';a.click();status('当前画面已截取')}catch(e){status(e.message)}};
$('ocr').onclick=async()=>{try{const c=frame();status('正在加载 OCR 引擎，首次使用需要联网……');if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(Error('OCR 资源下载失败，请检查网络'));document.head.appendChild(s);});}if(!worker)worker=await Tesseract.createWorker('eng');status('正在识别当前视频帧……');const r=await worker.recognize(c);const t=(r.data.text||'').trim();$('ocrTxt').textContent='提取文字（尚未确认）：\n'+(t||'没有识别出文字');status('OCR 完成，请根据视频核对数字并在下方手动填写');}catch(e){status('OCR 失败：'+e.message)}};
function sync(){ $('vSpeed').textContent=$('speed').value||'--';$('vDistance').textContent=($('distance').value||'--')+' m';$('vRoad').textContent=$('road').value||'导航未连接'}
['speed','distance','road','range'].forEach(id=>$(id).addEventListener('input',sync));
function signal(id,num,green){const e=$(id);e.textContent=num;e.classList.toggle('green',!!green)}
$('demo').onclick=()=>{$('speed').value=68;$('distance').value=350;$('road').value='建设路';$('range').value=560;sync();signal('vLeft','18',false);signal('vStraight','26',true);signal('vRight','22',true);status('已加载演示数据（并非视频识别结果）')};
$('clear').onclick=()=>{['speed','distance','road','range'].forEach(id=>$(id).value='');sync();['vLeft','vStraight','vRight'].forEach(id=>signal(id,'--',false));status('已清除演示数据')};
$('full').onclick=async()=>{try{if($('hud').requestFullscreen)await $('hud').requestFullscreen();else status('此浏览器限制自定义全屏，可旋转手机横屏观看')}catch(e){status('全屏受浏览器限制：'+e.message)}};
sync();log('当前浏览器：'+navigator.userAgent);
})();
</script></body></html>
