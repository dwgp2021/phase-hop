<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7e8be"><title>牙牙弹 · TOOTH POP</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f7e8be;color:#44372f;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,sans-serif;touch-action:none}main{height:100dvh;max-width:470px;margin:auto;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 7px) 12px calc(env(safe-area-inset-bottom) + 10px)}header{display:flex;width:100%;align-items:center;justify-content:space-between;padding:3px 4px 7px}.brand{font-size:25px;font-weight:1000;letter-spacing:-1px}.brand span{color:#df7858}.tiny{font-size:10px;color:#9c8570;font-weight:850;letter-spacing:1px}.level{background:#fff9ed;border:2px solid #5d4b3b;border-radius:13px;padding:6px 12px;box-shadow:2px 3px 0 #5d4b3b;font-size:14px;font-weight:900}canvas{background:#fdf5de;border:3px solid #5d4b3b;border-radius:21px;box-shadow:4px 5px 0 #5d4b3b;display:block;width:min(100%,calc((100dvh - 196px)*.5625));max-width:100%;aspect-ratio:360/640;min-height:0;flex:1;touch-action:none}.bottom{width:100%;display:flex;gap:9px;margin-top:12px}.btn{border:2px solid #5d4b3b;border-radius:15px;padding:14px;font-weight:950;font-size:16px;color:#4d372a;background:#ffb86b;box-shadow:2px 3px 0 #5d4b3b;flex:1;min-height:54px}.btn.alt{background:#fffaf0;flex:0 0 75px}.btn:active,.cta:active{transform:translate(2px,3px);box-shadow:none}.caption{text-align:center;font-size:12px;color:#867465;padding:10px 0 2px;font-weight:700;min-height:34px}.toast{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);background:#fff9eb;border:3px solid #584536;border-radius:22px;padding:15px 24px;font-size:25px;font-weight:1000;white-space:nowrap;box-shadow:4px 6px 0 #584536;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}.screen{position:fixed;inset:0;background:#f6e7c5f5;display:flex;align-items:center;justify-content:center;padding:25px;z-index:5}.screen.hidden{display:none}.panel{width:min(340px,100%);text-align:center}.mascot{height:125px;width:125px;border:4px solid #513f32;border-radius:44% 52% 44% 48%;margin:0 auto 20px;background:#96cc9a;transform:rotate(-6deg);position:relative;box-shadow:6px 7px 0 #513f32}.mascot:before,.mascot:after{content:"";position:absolute;top:42px;width:11px;height:15px;border-radius:50%;background:#513f32}.mascot:before{left:33px}.mascot:after{right:33px}.smile{position:absolute;left:43px;top:67px;width:38px;height:26px;border:4px solid #513f32;background:#a8474c;border-radius:7px 7px 23px 23px}.smile:after{content:"";position:absolute;bottom:0;left:10px;background:#ec8791;border-radius:50%;width:15px;height:9px}.heading{font-weight:1000;font-size:45px;letter-spacing:-2px;margin:0 0 5px}.desc{font-size:14px;color:#766354;line-height:1.8}.instructions{text-align:left;background:#fff9ed;border:2px solid #5d4b3b;box-shadow:3px 4px 0 #5d4b3b;border-radius:18px;margin:25px 0;padding:17px;font-size:14px;line-height:2.2}.instructions b{color:#db7655}.cta{width:100%;border:2px solid #5d4b3b;border-radius:16px;background:#f8a86b;color:#493b30;font-size:18px;font-weight:950;height:58px;box-shadow:3px 4px 0 #5d4b3b}</style></head><body><main><header><div><div class="brand">牙牙<span>弹!</span></div><div class="tiny">TOOTH POP · 小怪兽的零食时间</div></div><div class="level" id="level">第 1 关</div></header><canvas id="canvas"></canvas><div class="bottom"><button class="btn alt" id="reset">↺ 重来</button><button class="btn" id="drop">🍬 放糖果！</button></div><div class="caption" id="caption">拖动大牙齿，给糖果安排弹跳路线</div></main><div class="toast" id="toast">好耶！</div><div class="screen" id="intro"><div class="panel"><div class="mascot"><div class="smile"></div></div><h1 class="heading">牙牙弹!</h1><div class="desc">帮嘴馋的小怪兽接住糖果。<br>一个会弹来弹去的小谜题。</div><div class="instructions"><b>①</b> 拖动场上的大牙齿，调整位置<br><b>②</b> 点击「放糖果」，看它弹到哪里<br><b>③</b> 弹进怪兽嘴里就过关！<br>✿ 不计时，不用急，随时重来</div><button id="play" class="cta">开饭啦！ →</button></div></div><div class="screen hidden" id="win"><div class="panel"><div class="mascot" style="background:#fac786;transform:rotate(8deg)"><div class="smile"></div></div><h1 class="heading" id="winTitle">吃到啦！</h1><div class="desc" id="winDesc">糖果真好吃！</div><div class="instructions" style="text-align:center">每一关都换一种弹跳路线。<br>再来一点点？</div><button id="next" class="cta">下一关 →</button></div></div>
<script>(()=>{'use strict';const C=document.getElementById('canvas'),g=C.getContext('2d'),$=x=>document.getElementById(x),W=360,H=640;let level=1,drag=false,playing=false,ball=null,frame=0,tries=0,tooth={x:170,y:310,r:33},scene,particles=[],last=0,audio,win=false;function size(){let d=Math.min(devicePixelRatio||1,2);C.width=720*d;C.height=1280*d;g.setTransform(2*d,0,0,2*d,0,0)}size();addEventListener('resize',size);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rng=n=>{let a=Math.sin(n*127.1+43.39)*43758.5453;return a-Math.floor(a)};function sceneFor(n){const k=n-1;let sx=65+Math.floor(rng(k+13)*210),mx=65+Math.floor(rng(k+21)*215);if(Math.abs(mx-sx)<65)mx=sx<180?268:92;return {sx,mx,wall:n>2&&n%3===0?{x:mx<180?206:90,y:380,w:64,h:12}:null,bonus:n>3&&n%4===0?{x:178,y:220,r:24}:null}}function prepare(){scene=sceneFor(level);tooth={x:clamp(scene.sx+(scene.mx>scene.sx?36:-36),53,307),y:300,r:33};ball=null;particles=[];frame=0;playing=false;win=false;drag=false;tries=0;$('level').textContent='第 '+level+' 关';$('drop').textContent='🍬 放糖果！';$('caption').textContent='拖动牙齿，给糖果安排弹跳路线'}try{level=clamp(parseInt(localStorage.getItem('tooth-pop-level'))||1,1,999)}catch(e){}prepare();function save(){try{localStorage.setItem('tooth-pop-level',level)}catch(e){}}function tone(f){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),a=audio.createGain();o.type='triangle';o.frequency.value=f;a.gain.setValueAtTime(.045,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+.16)}catch(e){}}function dot(x,y,color,n){for(let i=0;i<n;i++){let a=Math.random()*6.283,v=2+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:36+Math.random()*24,color})}}function rounded(x,y,w,h,r,color,stroke='#594435',line=3){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=color;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=line;g.stroke()}}function circle(x,y,r,color,line=3){g.beginPath();g.arc(x,y,r,0,6.283);g.fillStyle=color;g.fill();if(line){g.lineWidth=line;g.strokeStyle='#594435';g.stroke()}}function drawMonster(){let mx=scene.mx;g.save();g.translate(mx,551);g.rotate(Math.sin(performance.now()/370)*.025);circle(0,0,66,level%2?'#a4d6b1':'#a9c9ea',4);circle(-20,-18,5,'#49372e',0);circle(20,-18,5,'#49372e',0);circle(-34,0,9,'#f1a4a1',0);circle(34,0,9,'#f1a4a1',0);rounded(-34,5,68,38,[12,12,23,23],'#793c48','#594435',3);circle(0,38,13,'#ef8e98',0);rounded(-20,5,14,12,3,'#fffbee','#fffbee',0);rounded(6,5,14,12,3,'#fffbee','#fffbee',0);g.restore();g.textAlign='center';g.font='bold 13px system-ui';g.fillStyle='#967e67';g.fillText('喂我！',mx,624)}function drawTooth(){g.save();g.translate(tooth.x,tooth.y);g.rotate(-.08);circle(0,0,32,'#fffefa',3.5);g.fillStyle='#d0c8ba';g.beginPath();g.ellipse(-11,-6,4,6,0,0,6.283);g.ellipse(11,-6,4,6,0,0,6.283);g.fill();g.lineCap='round';g.beginPath();g.arc(0,0,10,.16,Math.PI-.16);g.strokeStyle='#594435';g.lineWidth=3;g.stroke();g.restore();g.textAlign='center';g.fillStyle='#a88b70';g.font='bold 12px system-ui';g.fillText('↔ 拖动我',tooth.x,tooth.y+52)}function paint(){g.clearRect(0,0,W,H);g.fillStyle='#fdf5de';g.fillRect(0,0,W,H);for(let y=40;y<640;y+=60)for(let x=22;x<355;x+=59){g.fillStyle='#e5d4b4';g.beginPath();g.arc(x,y,1.5,0,6.283);g.fill()}g.fillStyle='#f1e5c9';g.beginPath();g.ellipse(180,635,180,43,0,0,6.283);g.fill();g.textAlign='center';g.fillStyle='#99846f';g.font='bold 13px system-ui';g.fillText('糖果入口',scene.sx,37);g.fillText('↓',scene.sx,56);rounded(scene.sx-32,61,64,10,5,'#a2d8be');if(scene.wall)rounded(scene.wall.x,scene.wall.y,scene.wall.w,scene.wall.h,5,'#f2ac8a');if(scene.bonus){circle(scene.bonus.x,scene.bonus.y,scene.bonus.r,'#f2c86f');g.font='bold 21px system-ui';g.fillStyle='#5a4736';g.fillText('✦',scene.bonus.x,scene.bonus.y+7)}drawMonster();drawTooth();if(ball){circle(ball.x,ball.y,13,'#f2a5a3');circle(ball.x-4,ball.y-5,3.5,'#fff7e2',0);g.font='bold 17px system-ui';g.fillStyle='#5d4938';g.fillText('•',ball.x+4,ball.y+5)}else{circle(scene.sx,86,13,'#f2a5a3');circle(scene.sx-4,81,3.5,'#fff7e2',0)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];g.globalAlpha=Math.max(0,p.life/55);circle(p.x,p.y,2.5,p.color,0);g.globalAlpha=1}}function drop(){if(playing||win)return;ball={x:scene.sx,y:88,vx:0,vy:0,hit:false};playing=true;frame=0;tries++;$('drop').textContent='弹跳中…';$('caption').textContent='看糖果飞去哪儿～';tone(450)}function failed(){playing=false;ball=null;$('drop').textContent='🍬 再放一次';$('caption').textContent='差一点！可以继续调整牙齿再试';tone(210)}function success(){if(win)return;win=true;playing=false;dot(scene.mx,550,'#ffb56f',40);tone(650);setTimeout(()=>tone(800),120);$('winTitle').textContent=['吃到啦！','嗷呜～','太妙啦！'][level%3];$('winDesc').textContent='第 '+level+' 关完成 · '+tries+' 次尝试';setTimeout(()=>$('win').classList.remove('hidden'),600)}function physics(){if(!playing||!ball)return;frame++;let b=ball;for(let q=0;q<3;q++){b.vy+=.09;b.x+=b.vx/3;b.y+=b.vy/3;if(b.x<14){b.x=14;b.vx=Math.abs(b.vx)*.8}if(b.x>346){b.x=346;b.vx=-Math.abs(b.vx)*.8}if(b.y<14){b.y=14;b.vy=Math.abs(b.vy)}let dx=b.x-tooth.x,dy=b.y-tooth.y,dist=Math.hypot(dx,dy);if(dist<46&&dist>0){let nx=dx/dist,ny=dy/dist;b.x=tooth.x+nx*46;b.y=tooth.y+ny*46;let impact=b.vx*nx+b.vy*ny;if(impact<0){b.vx-=1.75*impact*nx;b.vy-=1.75*impact*ny}b.vx+=nx*.35;b.vy+=ny*.35;b.hit=true;if(q===0){dot(b.x,b.y,'#f5af7b',9);tone(550)}}if(scene.wall){let v=scene.wall;if(b.x>v.x-13&&b.x<v.x+v.w+13&&b.y>v.y-13&&b.y<v.y+v.h+13){b.y=v.y-13;b.vy=-Math.abs(b.vy)*.65;b.vx+=(b.x<v.x+v.w/2?-.6:.6)}}if(scene.bonus){let p=scene.bonus;if(Math.hypot(b.x-p.x,b.y-p.y)<p.r+12){b.vx+=(scene.mx-b.x)*.017;b.vy=-Math.max(2,Math.abs(b.vy)*.8);dot(b.x,b.y,'#ffd25e',5)}}let gap=scene.mx-b.x;if(b.y>405&&Math.abs(gap)<125){b.vx+=clamp(gap*.0015,-.10,.10)}b.vx*=.999;if(Math.abs(b.vx)>10)b.vx=Math.sign(b.vx)*10}if(b.y>503&&Math.abs(b.x-scene.mx)<60){success()}else if(b.y>655||frame>850){failed()}}function loop(ms){let dt=Math.min((ms-last)/16.7||1,3);last=ms;if(playing)for(let n=0;n<Math.min(3,Math.ceil(dt));n++)physics();for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--}particles=particles.filter(p=>p.life>0);paint();requestAnimationFrame(loop)}requestAnimationFrame(loop);function coords(e){let rect=C.getBoundingClientRect();return{x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height}}C.addEventListener('pointerdown',e=>{if(playing||win)return;let p=coords(e);if(Math.hypot(p.x-tooth.x,p.y-tooth.y)<65){drag=true;C.setPointerCapture(e.pointerId);e.preventDefault()}});C.addEventListener('pointermove',e=>{if(!drag||playing)return;let p=coords(e);tooth.x=clamp(p.x,34,326);tooth.y=clamp(p.y,145,450)});C.addEventListener('pointerup',()=>drag=false);C.addEventListener('pointercancel',()=>drag=false);$('drop').onclick=drop;$('reset').onclick=()=>{prepare();$('caption').textContent='重新开始啦，换个位置试试'};$('play').onclick=()=>$('intro').classList.add('hidden');$('next').onclick=()=>{level++;save();prepare();$('win').classList.add('hidden')};})();</script></body></html>
