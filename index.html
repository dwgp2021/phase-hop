<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7edce"><title>坏蛋小区 · 邻居们的离谱日常</title><style>
:root{--ink:#42362e;--bg:#f7edce;--card:#fffaf0;--edge:#59483a;--accent:#f5a76b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:disabled{opacity:.46;cursor:default}.wrap{max-width:490px;min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 95px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:26px;font-weight:1000;letter-spacing:-1px}.brand span{color:#db7855}.subtitle{font-size:11px;color:#907d68;font-weight:750;margin-top:-3px}.money{border:2px solid var(--edge);background:#fff7df;padding:8px 10px;border-radius:15px;box-shadow:2px 3px var(--edge);font-size:15px;font-weight:950;white-space:nowrap}.meta{display:flex;gap:8px;margin:18px 0 13px}.pill{background:#fff8e5;border:1.8px solid var(--edge);border-radius:20px;padding:6px 10px;font-weight:850;font-size:12px}.scene{height:255px;position:relative;background:#d8e9cc;overflow:hidden;border:3px solid var(--edge);border-radius:23px;box-shadow:4px 5px 0 var(--edge)}.sky{height:66%;background:#cae5e7}.sun{position:absolute;right:28px;top:25px;width:47px;height:47px;background:#ffcf7e;border:2px solid #b78c51;border-radius:50%}.cloud{position:absolute;background:#fff9e8;border-radius:30px;width:80px;height:21px;left:24px;top:29px}.cloud:after{content:"";position:absolute;left:20px;bottom:5px;width:38px;height:30px;border-radius:50%;background:#fff9e8}.ground{position:absolute;bottom:0;height:36%;width:100%;background:#b7d4a1;border-top:3px solid #789568}.home{position:absolute;bottom:29px;left:50%;transform:translateX(-50%);width:219px;height:153px;background:#f4c19c;border:3px solid var(--edge);border-radius:9px;box-shadow:6px 5px #0001}.roof{position:absolute;top:-43px;left:-20px;width:256px;height:58px;background:#df8c75;border:3px solid var(--edge);clip-path:polygon(50% 0,100% 85%,100% 100%,0 100%,0 85%)}.door{position:absolute;bottom:0;left:90px;width:49px;height:75px;background:#a97e67;border:3px solid var(--edge);border-radius:22px 22px 0 0}.door:after{content:"";position:absolute;right:7px;top:37px;width:6px;height:6px;background:#ffe2a2;border:1px solid var(--edge);border-radius:50%}.window{position:absolute;top:38px;left:17px;width:50px;height:49px;background:#a6d8e9;border:3px solid var(--edge);border-radius:7px}.window:after{content:"";position:absolute;left:20px;width:3px;height:43px;background:var(--edge)}.window.r{left:auto;right:17px}.mat{position:absolute;bottom:11px;left:calc(50% - 55px);width:110px;height:18px;border:2px solid var(--edge);border-radius:50%;background:#edd49a}.person{position:absolute;bottom:17px;left:43px;font-size:44px;filter:drop-shadow(2px 3px 0 #5a433477);animation:wiggle 2.3s ease-in-out infinite}@keyframes wiggle{50%{transform:translateY(-6px) rotate(5deg)}}.bubble{position:absolute;top:9px;left:50%;transform:translateX(-50%);background:#fffdf2;border:2px solid var(--edge);padding:7px 13px;border-radius:15px;font-size:13px;font-weight:850;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}.heading{display:flex;align-items:center;justify-content:space-between;margin:19px 0 10px;font-weight:1000;font-size:18px}.muted{font-size:12px;color:#907e6a}.card{background:var(--card);border:2px solid var(--edge);border-radius:17px;box-shadow:3px 4px 0 var(--edge);padding:13px;margin-bottom:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.object{min-height:128px;text-align:center;padding:12px 4px;border:2px solid #806a56;border-radius:14px;background:#fff7e6;position:relative;box-shadow:2px 2px 0 #806a56}.object.on{background:#d3ecd5}.object .emoji{font-size:38px;display:block;margin:2px 0 8px}.object strong{display:block;font-size:13px}.object small{display:block;font-size:10px;color:#937c65;margin-top:6px}.tag{position:absolute;right:5px;top:5px;font-size:10px;border-radius:8px;padding:3px 5px;background:#f5be89;border:1px solid #8a7055;font-weight:900}.action{width:100%;border:2px solid var(--edge);background:#f5ac79;border-radius:14px;padding:14px 12px;font-size:15px;font-weight:950;box-shadow:2px 3px 0 var(--edge)}.action.light{background:#fdf5dd}.action.green{background:#add5ac}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.row button{flex:1}.neighbor{display:flex;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:19px;background:#f4dfb3;border:2px solid var(--edge);display:grid;place-items:center;font-size:32px;flex:none}.neighbor .info{flex:1}.neighbor b{font-size:16px}.neighbor p{font-size:12px;color:#917c66;margin:5px 0}.neighbor .action{width:auto;padding:11px}.feed{display:flex;gap:10px;align-items:start;padding:11px 0;border-bottom:1px dashed #ccbca2}.feed:last-child{border:0}.feed i{font-style:normal;font-size:25px}.feed .details{font-size:13px;line-height:1.6;flex:1}.feed small{color:#998977;display:block;margin-top:4px;font-size:11px}.empty{text-align:center;padding:28px 15px;color:#8c7c69;font-size:13px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(490px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);border-top:2px solid var(--edge);background:#fff7e4;z-index:5}.tab{border:0;background:transparent;border-radius:12px;padding:6px 3px;font-size:11px;font-weight:900}.tab .ico{display:block;font-size:23px;margin-bottom:3px}.tab.selected{background:#f1c89f}.panel{display:none}.panel.active{display:block}.modalwrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#392a22aa;z-index:20;padding:20px}.modalwrap.show{display:flex}.modal{width:min(420px,100%);background:#fff8e6;border:3px solid var(--edge);box-shadow:6px 7px 0 #392b20;border-radius:22px;padding:21px;text-align:center}.modal h2{margin:3px 0 8px;font-size:24px}.modal p{font-size:14px;color:#796955;line-height:1.8}.modal .big{font-size:66px;margin:6px 0}.modal .row{margin-top:20px}.notice{position:fixed;left:50%;top:13%;transform:translateX(-50%);z-index:30;max-width:88%;padding:12px 19px;background:#fff9e7;border:2px solid var(--edge);border-radius:14px;box-shadow:3px 4px 0 var(--edge);font-size:13px;font-weight:900;display:none;text-align:center}.notice.show{display:block}.badge{background:#f0b67d;font-size:11px;padding:4px 6px;border-radius:9px;border:1px solid #76604f}.tutorial{line-height:1.9;font-size:14px;text-align:left}.spark{position:absolute;font-size:24px;pointer-events:none;animation:float 1s forwards}@keyframes float{to{opacity:0;transform:translateY(-50px) rotate(30deg)}}
</style></head><body><main class="wrap"><header><div><div class="brand">坏蛋<span>小区</span> 🏘️</div><div class="subtitle">邻居们的离谱日常</div></div><div class="money" id="money">🪙 0</div></header><div class="meta"><div class="pill" id="repute">😈 调皮值 0</div><div class="pill" id="energy">⚡ 3/3</div><div class="pill" id="day">☀️ 第 1 天</div></div><section id="home" class="panel active"><div class="scene" id="scene"><div class="sky"></div><div class="sun"></div><div class="cloud"></div><div class="ground"></div><div class="home"><div class="roof"></div><div class="window"></div><div class="window r"></div><div class="door"></div></div><div class="mat"></div><div class="person">🐱</div><div class="bubble" id="speech">今天好像很平静……</div></div><div class="heading">我的秘密机关 <span class="muted" id="armed">已布置 0/3</span></div><div class="grid" id="traps"></div><div class="heading">今天想干点什么？</div><div class="card"><div class="row"><button class="action green" id="collect">📮 收取今日奖励</button><button class="action light" id="invite">🚪 引邻居串门</button></div><p class="muted" style="margin:12px 0 1px">放好机关，邻居路过可能触发连锁事件。离开游戏也会发生！</p></div></section><section id="street" class="panel"><div class="heading">隔壁那帮人 <span class="muted">点击拜访，偷偷搞事</span></div><div id="neighbors"></div><div class="card" style="margin-top:15px"><strong>🥨 小区公约</strong><p class="muted" style="line-height:1.9">你可以恶作剧、借走小物件、送礼物，也可能遭到报复。虚拟邻居会记住你干过的事。</p></div></section><section id="diary" class="panel"><div class="heading">小区八卦墙 <span class="muted" id="feedCount"></span></div><div class="card" id="feed"></div></section><section id="shop" class="panel"><div class="heading">古怪杂货铺</div><div class="card" style="line-height:1.7;font-size:13px">🛎️ 老板说：「别问这些东西有什么用，先放到家里试试看。」<br><span class="muted">买来的机关可以永久布置和更换。</span></div><div id="inventoryShop"></div><div class="heading">小区秘密档案</div><div class="card" id="achievements"></div><button class="action light" id="help">📖 游戏说明</button></section></main><nav class="tabs"><button class="tab selected" data-tab="home"><span class="ico">🏠</span>我的家</button><button class="tab" data-tab="street"><span class="ico">🛵</span>串门</button><button class="tab" data-tab="diary"><span class="ico">📰</span>八卦墙</button><button class="tab" data-tab="shop"><span class="ico">🧰</span>杂货铺</button></nav><div id="modalwrap" class="modalwrap"><div class="modal" id="modal"></div></div><div id="notice" class="notice"></div><script>
(()=>{'use strict';const $=s=>document.getElementById(s);const traps=[{id:'spring',name:'弹簧沙发',icon:'🛋️',cost:0,desc:'弹走客人',words:['沙发突然起飞','把邻居弹到了天花板'],bonus:18},{id:'plant',name:'尖叫盆栽',icon:'🪴',cost:0,desc:'吓人一跳',words:['花盆竟然会尖叫','惊得邻居跳了三步'],bonus:16},{id:'duck',name:'橡皮鸭军团',icon:'🦆',cost:40,desc:'鸭鸭包围',words:['一群鸭子从柜子里冲出来','鸭子们占领了客厅'],bonus:23},{id:'banana',name:'香蕉传送门',icon:'🍌',cost:65,desc:'随机瞬移',words:['一脚踩进香蕉传送门','眨眼间被传送到屋顶'],bonus:32},{id:'mirror',name:'哈哈镜',icon:'🪞',cost:100,desc:'分身恶作剧',words:['镜子里多出了三个自己','被自己的镜像追着跑'],bonus:39},{id:'robot',name:'扫地机器人',icon:'🤖',cost:150,desc:'横冲直撞',words:['扫地机突然发动追逐战','被机器人当成垃圾追着跑'],bonus:46},{id:'cake',name:'惊喜蛋糕',icon:'🎂',cost:210,desc:'蛋糕大爆炸',words:['蛋糕喷出满屋奶油','头顶被盖上了奶油皇冠'],bonus:53},{id:'ghost',name:'害羞小幽灵',icon:'👻',cost:290,desc:'神出鬼没',words:['幽灵躲进了鞋盒','幽灵偷穿了邻居的袜子'],bonus:62}];const neighbors=[{id:'mao',name:'毛毛',emoji:'🐻',trait:'爱炫耀 · 怕痒',home:'泡泡小屋',weak:'spring',gift:'蜂蜜饼干'},{id:'tu',name:'兔叽',emoji:'🐰',trait:'爱干净 · 怕鸭子',home:'胡萝卜公寓',weak:'duck',gift:'胡萝卜蛋糕'},{id:'gou',name:'阿柴',emoji:'🐶',trait:'大嗓门 · 胆小',home:'骨头城堡',weak:'plant',gift:'小骨头'},{id:'zhu',name:'猪猪',emoji:'🐷',trait:'贪吃 · 总是迟到',home:'甜甜小铺',weak:'cake',gift:'草莓布丁'}];const KEY='badhood_v2';const now=()=>Date.now();const choose=a=>a[Math.floor(Math.random()*a.length)];const fresh=()=>({coins:85,rep:0,energy:3,energyTime:now(),start:now(),last:now(),claimed:0,owned:['spring','plant'],armed:['spring'],logs:[],visits:0,chains:0,gifts:0,retaliations:0,level:1,relations:{},tutorial:false});let s;try{s=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'null')||{})}catch(e){s=fresh()}let modalCallback=null,noticeTimer;const save=()=>{s.last=now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};const day=()=>Math.floor((now()-s.start)/86400000)+1;const log=(icon,msg)=>{s.logs.unshift({icon,msg,t:now()});s.logs=s.logs.slice(0,100)};const label=t=>{let m=Math.round((now()-t)/60000);return m<1?'刚刚':m<60?m+'分钟前':m<1440?Math.floor(m/60)+'小时前':Math.floor(m/1440)+'天前'};function updateEnergy(){let gained=Math.floor((now()-s.energyTime)/120000);if(gained>0){s.energy=Math.min(3,s.energy+gained);s.energyTime+=gained*120000;if(s.energy===3)s.energyTime=now()}}function toast(t){const e=$('notice');e.textContent=t;e.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>e.classList.remove('show'),2500)}function modal(icon,title,body,buttons=[{text:'好耶！',fn:null}]){const root=$('modal');root.innerHTML='<div class="big">'+icon+'</div><h2>'+title+'</h2><p>'+body+'</p><div class="row" id="modalButtons"></div>';const w=$('modalButtons');buttons.forEach(b=>{let el=document.createElement('button');el.className='action '+(b.light?'light':'');el.textContent=b.text;el.onclick=()=>{$('modalwrap').classList.remove('show');if(b.fn)b.fn()};w.appendChild(el)});$('modalwrap').classList.add('show')}function chain(n,source,who){const equipped=s.armed.map(id=>traps.find(t=>t.id===id)).filter(Boolean);const first=equipped.length?choose(equipped):traps[0];const count=Math.min(equipped.length,1+Math.floor(Math.random()*3));let parts=[first.words[Math.floor(Math.random()*first.words.length)]],reward=first.bonus;for(let i=1;i<count;i++){let t=equipped[(equipped.indexOf(first)+i)%equipped.length];if(t){parts.push(t.words[Math.floor(Math.random()*t.words.length)]);reward+=t.bonus}}const twist=choose(['最后把邻居的帽子变成了披萨！','结果大家竟然笑到肚子疼！','没想到顺手捡到一枚幸运金币！','可惜路过的保安全都看见了。','邻居发誓一定要报复回来！']);reward+=count*8;s.coins+=reward;s.rep+=count*3;s.chains+=count>1?1:0;let story=who+' '+parts.join('，接着')+'，'+twist;log('🎉',story+' 获得 '+reward+' 金币');if(source==='guest')s.relations[who]=(s.relations[who]||0)-1;return {story,reward,count}}function away(){const elapsed=Math.min(48,Math.floor((now()-s.last)/300000));if(elapsed<=0)return;let events=Math.min(4,Math.floor(elapsed/2));let total=0;let stories=[];for(let i=0;i<events;i++){let who=choose(neighbors).name,r=chain(i,'guest',who);total+=r.reward;stories.push(who)}if(events){log('📬','你不在时，'+stories.join('、')+'来家里捣乱，触发了 '+events+' 次机关');setTimeout(()=>modal('📬','趁你不在……',stories.join('、')+' 来你家做客，机关发动了 '+events+' 次！<br>一共赚了 <b>'+total+' 金币</b>。'),650)}}away();function renderHeader(){$('money').textContent='🪙 '+s.coins;$('repute').textContent='😈 调皮值 '+s.rep;$('energy').textContent='⚡ '+s.energy+'/3';$('day').textContent='☀️ 第 '+day()+' 天';$('armed').textContent='已布置 '+s.armed.length+'/3'}function renderTraps(){$('traps').innerHTML=s.owned.map(id=>{let t=traps.find(t=>t.id===id);return '<button class="object '+(s.armed.includes(id)?'on':'')+'" data-trap="'+id+'"><span class="emoji">'+t.icon+'</span><strong>'+t.name+'</strong><small>'+t.desc+'</small>'+(s.armed.includes(id)?'<span class="tag">已布置</span>':'')+'</button>'}).join('');$('traps').querySelectorAll('[data-trap]').forEach(b=>b.onclick=()=>{let id=b.dataset.trap;if(s.armed.includes(id)){s.armed=s.armed.filter(x=>x!==id);toast('已经收起来啦')}else if(s.armed.length>=3){toast('最多只能布置 3 个机关')}else{s.armed.push(id);toast('机关布置好啦！')}save();render()})}function renderNeighbors(){$('neighbors').innerHTML=neighbors.map(n=>'<div class="card neighbor"><div class="avatar">'+n.emoji+'</div><div class="info"><b>'+n.name+'</b><p>'+n.trait+'</p><small class="muted">'+n.home+' · 关系 '+(s.relations[n.name]||0)+'</small></div><button class="action" data-visit="'+n.id+'">串门</button></div>').join('');$('neighbors').querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>visit(b.dataset.visit))}function renderFeed(){$('feedCount').textContent=s.logs.length+' 条消息';$('feed').innerHTML=s.logs.length?s.logs.map(o=>'<div class="feed"><i>'+o.icon+'</i><div class="details">'+o.msg+'<small>'+label(o.t)+'</small></div></div>').join(''):'<div class="empty">还没有动静，去隔壁串串门吧！</div>'}function renderShop(){$('inventoryShop').innerHTML=traps.map(t=>'<div class="card neighbor"><div class="avatar">'+t.icon+'</div><div class="info"><b>'+t.name+'</b><p>'+t.desc+' · '+t.bonus+'+ 奖励</p></div><button class="action '+(s.owned.includes(t.id)?'green':'')+'" data-buy="'+t.id+'" '+(s.owned.includes(t.id)?'disabled':'')+'>'+(s.owned.includes(t.id)?'已拥有':'🪙 '+t.cost)+'</button></div>').join('');$('inventoryShop').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let t=traps.find(a=>a.id===b.dataset.buy);if(s.coins<t.cost){toast('金币还不够，去搞点恶作剧！');return}s.coins-=t.cost;s.owned.push(t.id);log('🛍️','在杂货铺买到了 '+t.name);save();render();modal(t.icon,'新机关入手！','「'+t.name+'」已经放进你的仓库。记得回家布置！')});let achievements=[['第一次使坏',s.visits>=1],['连锁反应专家',s.chains>=5],['人缘古怪',s.gifts>=3],['报复大师',s.retaliations>=3],['机关收藏家',s.owned.length>=6]];$('achievements').innerHTML=achievements.map(x=>'<div class="feed"><i>'+(x[1]?'🏅':'🔒')+'</i><div class="details">'+x[0]+'<small>'+(x[1]?'已解锁':'继续探索')+'</small></div></div>').join('')}function render(){updateEnergy();renderHeader();renderTraps();renderNeighbors();renderFeed();renderShop()}function spend(){updateEnergy();if(s.energy<=0){toast('体力不够！每 2 分钟恢复一点');return false}s.energy--;s.energyTime=now();return true}function visit(id){const n=neighbors.find(n=>n.id===id);if(!spend())return;modal(n.emoji,'悄悄来到'+n.name+'家','你看到了一屋子奇怪的摆设。打算做什么？',[{text:'😈 搞恶作剧',fn:()=>prank(n)},{text:'🎁 送小礼物',light:true,fn:()=>gift(n)}]);save();render()}function prank(n){s.visits++;let device=choose(traps.filter(t=>s.owned.includes(t.id)));let surprise=n.weak===device.id;let gain=10+Math.floor(Math.random()*28)+(surprise?35:0);let twist=choose(['脚下一滑，把全屋家具换了个位置','结果自己被弹簧反弹到了门外','被一只路过的鸽子拍下了照片','本想偷偷离开，却撞翻一篮子袜子','隔壁邻居看热闹笑得停不下来']);let result='你把'+device.name+'藏在'+n.home+'。'+n.name+twist+'！';s.coins+=gain;s.rep+=surprise?9:4;s.relations[n.name]=(s.relations[n.name]||0)-2;log('😈',result+' 获得 '+gain+' 金币');let backlash=Math.random()<.4;if(backlash){s.retaliations++;let loss=Math.min(s.coins,6+Math.floor(Math.random()*13));s.coins-=loss;log('💥',n.name+' 反手来你家泼了一桶泡泡水！损失 '+loss+' 金币');result+='<br><br>但'+n.name+'居然反过来整了你！损失 '+loss+' 金币。'}save();render();modal(n.emoji,surprise?'完美整蛊！':'闹出笑话啦！',result+'<br><b>🪙 +'+gain+'</b>')}function gift(n){let cost=12;if(s.coins<cost){toast('送礼至少需要 12 金币');s.energy=Math.min(3,s.energy+1);save();render();return}s.coins-=cost;s.gifts++;s.relations[n.name]=(s.relations[n.name]||0)+3;let bonus=Math.random()<.35?35:0;if(bonus)s.coins+=bonus;log('🎁','给'+n.name+'送了'+n.gift+'，关系变好了'+(bonus?'，还回赠了 '+bonus+' 金币':'')+'！');save();render();modal('🎁','送礼成功！',n.name+' 收到礼物后开心地转了三圈。'+(bonus?'<br>还回赠了 '+bonus+' 金币！':''))}$('collect').onclick=()=>{if(s.claimed===day()){toast('今天的奖励已经领取了，明天再来！');return}s.claimed=day();s.coins+=45;log('💌','领取小区今日补贴 +45 金币');save();render();modal('💌','每日零花钱','今天领到了 <b>45 枚金币</b>。快去杂货铺看看有什么稀奇古怪的东西！')};$('invite').onclick=()=>{if(!s.armed.length){toast('先布置至少一个机关！');return}if(!spend())return;const who=choose(neighbors),r=chain(1,'guest',who.name);$('speech').textContent=who.name+'：啊啊啊！';save();render();modal(who.emoji,'串门翻车现场',r.story+'<br><b>🪙 +'+r.reward+' · '+r.count+' 连锁</b>');setTimeout(()=>$('speech').textContent='今天好像很平静……',4500)};$('help').onclick=()=>modal('🏘️','小区生存指南','① 去杂货铺买机关，回家最多布置 3 个。<br>② 邀邻居串门，机关会连续触发。<br>③ 去邻居家使坏或送礼，关系会变化。<br>④ 隔一阵回来看看离线事件和八卦墙。<br>⑤ 这是单机版，邻居是虚拟角色，存档保存在当前浏览器。');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('selected',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab));render()});render();save();setInterval(()=>{updateEnergy();renderHeader();save()},30000);if(!s.tutorial){s.tutorial=true;save();setTimeout(()=>$('help').click(),500)}document.addEventListener('visibilitychange',()=>{if(!document.hidden){away();render();save()}else save()})})();
</script></body></html>
