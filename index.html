<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080c19"><title>跃迁 PHASE HOP</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c19;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.top{position:absolute;top:calc(env(safe-area-inset-top) + 22px);left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none}.stat small{display:block;font-size:11px;color:#8d9db8;letter-spacing:2px}.stat b{font-size:36px}.stat:last-child{text-align:right}.stat:last-child b{color:#8effdf}.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 23px);width:100%;text-align:center;color:#91a2bd;font-size:13px;letter-spacing:2px;pointer-events:none}.screen{position:absolute;inset:0;background:#090e1de9;display:grid;place-items:center;padding:25px}.hide{display:none}.panel{width:100%;max-width:360px;text-align:center}.tag{color:#86ffe4;letter-spacing:4px;font-size:12px;font-weight:700}h1{font-size:65px;letter-spacing:3px;margin:10px 0 0;background:linear-gradient(110deg,#fff,#8effe3,#8da4ff);color:transparent;background-clip:text}.sub{font-size:12px;color:#9cacc4;letter-spacing:6px}.rules{border:1px solid #ffffff24;background:#ffffff09;border-radius:18px;text-align:left;padding:22px;margin:35px 0;font-size:14px;line-height:2.5;color:#d1deeb}.green{color:#8effdf}.pink{color:#ff718f}button{border:0;background:#8effdf;color:#09251d;border-radius:17px;height:57px;width:100%;font-size:17px;font-weight:800}.minor{color:#8595ae;font-size:12px;margin-top:20px}.pause{position:absolute;left:20px;bottom:18px;width:42px;height:42px;background:#ffffff18;color:white;border:1px solid #ffffff30;border-radius:50%}.final{font-size:78px;font-weight:800;margin:20px 0}</style><canvas id="game"></canvas><div class="top"><div class="stat"><small>SCORE 得分</small><b id="score">0</b></div><div class="stat"><small>BEST 最高</small><b id="best">0</b></div></div><div class="hint">点击任意位置 · 切换轨道</div><button class="pause" id="pause">Ⅱ</button><section id="startView" class="screen"><div class="panel"><div class="tag">✦ ONE TAP ARCADE ✦</div><h1>跃 迁</h1><div class="sub">PHASE HOP</div><div class="rules"><span class="green">① 轻点屏幕</span>，瞬间切换内外轨道<br><span class="pink">② 躲开红色脉冲</span>，碰到就结束<br><span class="green">③ 收集绿色能量</span>，连续收集加分</div><button id="start">开始跃迁 ↗</button><div class="minor">单手操作 · 越来越快 · 自动记录最高分</div></div></section><section id="endView" class="screen hide"><div class="panel"><div class="tag">✦ RUN COMPLETE ✦</div><h1>再试一次</h1><div class="final" id="final">0</div><div class="sub" id="record"></div><div class="rules" style="text-align:center">再接近一点，再坚持一秒。</div><button id="restart">再次跃迁 ↗</button></div></section><section id="pauseView" class="screen hide"><div class="panel"><h1>已暂停</h1><div class="rules" style="text-align:center">准备好继续了吗？</div><button id="resume">继续 →</button></div></section><script>(()=>{let canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let w,h,cx,cy,outer,inner,theta=-Math.PI/2,spin=1.45,lane=0,shown=0,objects=[],next=0,score=0,combo=0,t=0,mode='menu',last=0,particles=[];let best=0;try{best=+localStorage.getItem('phase-hop-best')||0}catch(e){}$('best').textContent=best;function resize(){w=innerWidth;h=innerHeight;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx=w/2;cy=h*.52;outer=Math.min(w*.36,h*.225,205);inner=outer*.66}onresize=resize;resize();function pos(a,r){return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]}function grow(){while(next<theta+4.7){let bad=Math.random()>.5?1:0;objects.push({angle:next,lane:bad,type:'bad',done:false},{angle:next,lane:1-bad,type:'good',done:false});next+=Math.max(.62,1.07-t/310)*(Math.random()*.28+.86)}}function start(){theta=-Math.PI/2;spin=1.45;lane=shown=0;objects=[];particles=[];next=theta+2;score=combo=t=0;grow();$('score').textContent='0';['startView','endView','pauseView'].forEach(id=>$(id).classList.add('hide'));mode='play'}function explode(p,color,num){for(let i=0;i<num;i++){let a=Math.random()*Math.PI*2,v=40+Math.random()*130;particles.push({x:p[0],y:p[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.4+Math.random()*.35,color})}}function end(){mode='over';if(score>best){best=score;try{localStorage.setItem('phase-hop-best',best)}catch(e){}}$('best').textContent=best;$('final').textContent=score;$('record').textContent='最高纪录 '+best;setTimeout(()=>{$('endView').classList.remove('hide')},300)}function flip(){if(mode!=='play')return;lane=1-lane;explode(pos(theta,lane?outer:inner),'#87ffe2',6);navigator.vibrate?.(8)}function step(dt){t+=dt;spin=Math.min(3.35,1.45+t*.018);theta+=dt*spin;shown+=(lane-shown)*Math.min(1,dt*18);grow();for(const o of objects){let delta=o.angle-theta;if(!o.done&&delta<.09&&delta>-.13){o.done=true;if(o.lane===lane){let p=pos(o.angle,o.lane?outer:inner);if(o.type==='bad'){explode(p,'#ff638f',35);end();break}else{combo++;score+=1+Math.floor(combo/5);$('score').textContent=score;explode(p,'#86ffe3',12)}}else if(o.type==='good')combo=0}}objects=objects.filter(o=>o.angle>theta-.45)}function draw(){let bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.75);bg.addColorStop(0,'#182640');bg.addColorStop(1,'#070b16');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);for(const r of [inner,outer]){ctx.lineWidth=22;ctx.strokeStyle='#9ec6ff15';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1.5;ctx.strokeStyle='#acc8ff50';ctx.stroke()}ctx.textAlign='center';ctx.font='bold 22px system-ui';ctx.fillStyle='#8db7d0';ctx.fillText('✦',cx,cy+7);for(const o of objects){if(o.angle-theta>4.75||o.angle-theta<-.3)continue;let r=o.lane?outer:inner,p=pos(o.angle,r);if(o.type==='bad'){ctx.lineCap='round';ctx.strokeStyle='#ff6085';ctx.lineWidth=11;ctx.shadowBlur=18;ctx.shadowColor='#ff4775';ctx.beginPath();ctx.arc(cx,cy,r,o.angle-.11,o.angle+.11);ctx.stroke()}else{ctx.fillStyle='#8bffe4';ctx.shadowBlur=15;ctx.shadowColor='#8bffe4';ctx.beginPath();ctx.moveTo(p[0],p[1]-10);ctx.lineTo(p[0]+8,p[1]);ctx.lineTo(p[0],p[1]+10);ctx.lineTo(p[0]-8,p[1]);ctx.fill()}ctx.shadowBlur=0}if(mode!=='menu'){let p=pos(theta,inner+(outer-inner)*shown);ctx.shadowBlur=25;ctx.shadowColor='#8bffe4';ctx.fillStyle='#8bffe4';ctx.beginPath();ctx.arc(...p,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='white';ctx.beginPath();ctx.arc(...p,4,0,Math.PI*2);ctx.fill()}for(const p of particles){ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}function frame(ms){let dt=Math.min(.04,(ms-last)/1000||.016);last=ms;if(mode==='play')step(dt);if(mode!=='paused'){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);canvas.onpointerdown=e=>{e.preventDefault();flip()};$('start').onclick=start;$('restart').onclick=start;$('pause').onclick=()=>{if(mode==='play'){mode='paused';$('pauseView').classList.remove('hide')}};$('resume').onclick=()=>{mode='play';$('pauseView').classList.add('hide')};onkeydown=e=>{if(e.code==='Space'){e.preventDefault();if(mode==='play')flip();else if(mode==='menu'||mode==='over')start()}};document.onvisibilitychange=()=>{if(document.hidden&&mode==='play')$('pause').click()}})();</script></html>
