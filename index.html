function earnFor(car){return types[car.type].rate*(car.park?.friend!=null?friends[car.park.friend].fee:1)}function accrue(){let dt=Math.min((now()-lastUpdate)/60000,480);if(dt<=0)return;for(let c of state.cars){if(c.park){c.earn=(c.earn||0)+dt*earnFor(c)}}lastUpdate=now()}function collect(){accrue();let sum=0;for(let c of state.cars){sum+=c.earn||0;c.earn=0}if(sum<.1){toast('还没有可收取的租金');return}state.money+=sum;log('收取停车租金 +'+format(sum));toast('收获 '+format(sum)+' 金币');save();render()}function parkCar(car,place,spot){accrue();if(car.park){if(car.park.friend===null)state.spots[car.park.spot]=null;car.park=null}if(place==='home'){if(state.spots[spot]!=null){toast('这个车位已被占用');return}state.spots[spot]=car.id;car.park={friend:null,spot}}else{let count=state.cars.filter(c=>c.park?.friend===spot).length;if(count>=friends[spot].free){toast('好友车位已经满了');return}car.park={friend:spot}}log('将 '+types[car.type].name+' 停到'+(place==='home'?'自家车位 '+(spot+1):friends[spot].name+'家'));toast('停车成功，开始计费！');save();render();let obj=carMeshes.get(car.id);if(obj){obj.userData.zTo=obj.position.z;obj.position.z=-14;obj.userData.entry=true}}function chooseParking(car){let choices=[];for(let i=0;i<3;i++)if(state.spots[i]===null||state.spots[i]===car.id)choices.push({label:'自家 '+(i+1)+' 号车位 · '+types[car.type].rate+'/分钟',onClick:()=>parkCar(car,'home',i)});for(let i=0;i<friends.length;i++)choices.push({label:friends[i].name+' · '+Math.round(earnFor({type:car.type,park:{friend:i}}))+'/分钟',onClick:()=>parkCar(car,'friend',i)});modal('安排停车','把车停在好友家通常更赚钱。也可以停在自己的车位。',choices)}function inspectSpot(i){let id=state.spots[i];if(id!=null){let c=state.cars.find(x=>x.id===id);if(c)modal((i+1)+' 号车位',types[c.type].name+' 正在停车，已累计 '+format(c.earn||0)+' 金币。',[{label:'收取并挪回车库',primary:true,onClick:()=>{accrue();state.money+=c.earn||0;c.earn=0;c.park=null;state.spots[i]=null;log('挪车回库并收取收入');render()}},{label:'查看车库',onClick:()=>switchPage('garage')}]);return}modal((i+1)+' 号空车位','选择车辆停放，或等待模拟邻居来抢占车位。',state.cars.filter(c=>!c.park).map(c=>({label:types[c.type].name,onClick:()=>parkCar(c,'home',i)})).concat([{label:'去买车',onClick:()=>switchPage('shop')}]))}
function simulate(){if(Math.random()>.56){let i=Math.floor(Math.random()*3);if(state.spots[i]===null){state.friendStates[0]++;log('隔壁阿强偷偷把车停在你的空位上');toast('阿强又来蹭车位了！')}}else{let parked=state.cars.filter(c=>c.park?.friend!=null);if(parked.length){let c=parked[Math.floor(Math.random()*parked.length)];let fee=Math.min(400,Math.ceil(earnFor(c)*3));state.money=Math.max(0,state.money-fee);log(friends[c.park.friend].name+'贴了你的车，罚金 '+fee);toast('你的车被好友贴条，损失 '+fee)}}save();render()}
function patrol(){let sum=0;for(let i=0;i<3;i++)if(state.spots[i]===null&&state.friendStates[0]>0){sum+=Math.floor(Math.random()*200+120);state.friendStates[0]--;break}if(!sum){toast('暂时没有发现违规停车');return}state.money+=sum;log('巡逻贴条，罚金收入 +'+sum);toast('抓到违规停车！+'+sum);save();render()}
function buy(i){let t=types[i];if(state.money<t.price){toast('金币不够，先收租金吧');return}modal('购买 '+t.name,'价格 '+format(t.price)+' 金币，每分钟收益 '+t.rate+'。确认购买吗？',[{label:'确认购买',primary:true,onClick:()=>{state.money-=t.price;state.cars.push({id:Math.max(...state.cars.map(c=>c.id),0)+1,type:i,park:null,time:0,earn:0});log('买入 '+t.name);toast('新车已入库');save();render()} }])}
function pageBtn(p){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x.dataset.page===p));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===p));if(p==='lot')setTimeout(()=>{if(renderer){renderer.setSize($('scene').clientWidth,$('scene').clientHeight,false);camera.aspect=$('scene').clientWidth/$('scene').clientHeight;camera.updateProjectionMatrix()}},50)}function switchPage(p){pageBtn(p);render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));$('collect').onclick=collect;$('patrol').onclick=patrol;
function render(){accrue();$('money').textContent=format(state.money);$('income').textContent=format(state.cars.filter(c=>c.park).reduce((a,c)=>a+earnFor(c),0));$('assets').textContent=format(state.money+state.cars.reduce((a,c)=>a+types[c.type].price,0));$('level').textContent=Math.max(1,Math.floor(state.cars.length/2)+1);$('spots').innerHTML='';for(let i=0;i<3;i++){let id=state.spots[i],c=state.cars.find(x=>x.id===id),b=document.createElement('button');b.className='spot';b.innerHTML='<b>'+(i+1).toString().padStart(2,'0')+' / 车位</b><small>'+(c?types[c.type].name:'空闲 · 可以停放')+'</small><strong>'+(c?'+'+format(c.earn||0)+' 金币':'点击安排停车')+'</strong>';b.onclick=()=>inspectSpot(i);$('spots').appendChild(b)}
$('lotInfo').innerHTML='<b>当前规则</b><br>停车计费按真实经过的时间累计，关闭网页后也会继续（最多补算 8 小时）。好友均为模拟角色，不是真实在线玩家。金币、车辆和事件存储在当前浏览器。';
$('friendsList').innerHTML='';friends.forEach((f,i)=>{let div=document.createElement('div');div.className='card friend';div.innerHTML='<div class="avatar">'+f.a+'</div><div class="body"><b>'+f.name+'</b><small>收益倍率 '+f.fee.toFixed(1)+'× · 空余 '+Math.max(0,f.free-state.cars.filter(c=>c.park?.friend===i).length)+' 位</small></div>';let b=document.createElement('button');b.className='btn small';b.textContent='去停车';b.onclick=()=>modal(f.name+' 的停车场','选择你车库里的车辆停到这里。',state.cars.map(c=>({label:types[c.type].name+' · '+Math.round(types[c.type].rate*f.fee)+'/分',onClick:()=>parkCar(c,'friend',i)})));div.appendChild(b);$('friendsList').appendChild(div)});
$('garageList').innerHTML='';state.cars.forEach(c=>{let d=document.createElement('div');d.className='carCard';d.innerHTML='<div class="carThumb" data-car="'+c.id+'"></div><div class="carBody"><b>'+types[c.type].name+'</b><small>'+(c.park?(c.park.friend===null?'自家 '+(c.park.spot+1)+' 号位':friends[c.park.friend].name+'家'):'空闲待命')+' · '+types[c.type].rate+'/分</small></div>';let b=document.createElement('button');b.className='btn';b.style.margin='0 8px 10px';b.style.width='calc(100% - 16px)';b.textContent=c.park?'挪车 / 换位':'去停车';b.onclick=()=>chooseParking(c);d.appendChild(b);$('garageList').appendChild(d)});
$('shopList').innerHTML='';types.forEach((t,i)=>{let d=document.createElement('div');d.className='carCard';d.innerHTML='<div class="carThumb" data-type="'+i+'"></div><div class="carBody"><b>'+t.name+'</b><small>收益 '+t.rate+' 金币/分钟</small><div style="font-size:15px;font-weight:900;color:#ab7b39;margin-bottom:9px">'+format(t.price)+' 金币</div></div>';let b=document.createElement('button');b.className='btn dark';b.style.margin='0 8px 10px';b.style.width='calc(100% - 16px)';b.textContent='购买车辆';b.onclick=()=>buy(i);d.appendChild(b);$('shopList').appendChild(d)});
updateCarVisuals();renderThumbs();save()}
function renderThumbs(){for(let holder of document.querySelectorAll('.carThumb')){let i=Number(holder.dataset.type??state.cars.find(c=>c.id==holder.dataset.car)?.type??0);let canvas=document.createElement('canvas');holder.appendChild(canvas);try{let r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'low-power'});r.setPixelRatio(1);r.setSize(holder.clientWidth,112,false);r.outputColorSpace=THREE.SRGBColorSpace;let s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xffffff,0x778a98,2.5));let light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-3,9,5);s.add(light);let cam=new THREE.PerspectiveCamera(35,holder.clientWidth/112,.1,80);cam.position.set(7,5,8);cam.lookAt(0,.55,0);s.add(buildCar(i));r.render(s,cam);r.dispose()}catch(e){holder.textContent=types[i].name}}}
let diff=Math.min(480,(now()-state.stamp)/60000);if(diff>1){state.cars.forEach(c=>{if(c.park)c.earn=(c.earn||0)+diff*earnFor(c)});if(diff>15)log('离线停车收入已累计 '+Math.floor(diff)+' 分钟')}lastUpdate=now();render();setInterval(()=>{if(!document.hidden){accrue();$('income').textContent=format(state.cars.filter(c=>c.park).reduce((a,c)=>a+earnFor(c),0));$('money').textContent=format(state.money);for(let i=0;i<3;i++){let c=state.cars.find(x=>x.id===state.spots[i]);if(c){let b=$('spots').children[i];if(b)b.querySelector('strong').textContent='+'+format(c.earn||0)+' 金币'}}save()}},4000);setInterval(()=>{if(!document.hidden)simulate()},70000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastUpdate=now();render()}else save()});window.addEventListener('beforeunload',save);
</script></body></html>
